name: Bug report
description: 报告表情提取或核验问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 请勿上传聊天库、密钥、账号截图或完整签名下载地址。安全问题请查看 SECURITY.md。
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: Windows / 微信 / Python 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 描述选用的子命令和脱敏后的操作步骤。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 脱敏错误信息
      render: text
